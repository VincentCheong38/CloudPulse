<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change password · CloudPulse</title>
  <link rel="stylesheet" href="auth-pages.css" />
</head>
<body class="auth-body">
  <script src="dot-field-bg.js"></script>
  <div class="auth-shell">
    <section class="card auth-card">
      <h1>Change your password</h1>
      <p id="requiredBanner" class="login-mode-hint" hidden></p>
      <p class="subtitle">
        Use a strong password you have not used elsewhere. After saving, continue from the administration area or open the
        dashboard when you are ready.
      </p>
      <div id="authError" class="auth-error" role="alert"></div>
      <div id="authOk" class="auth-success" role="status"></div>
      <form id="pwForm" class="auth-form" novalidate>
        <label>
          <span>Current password</span>
          <input id="currentPw" type="password" autocomplete="current-password" required />
        </label>
        <label>
          <span>New password</span>
          <input id="newPw" type="password" autocomplete="new-password" minlength="6" required />
        </label>
        <label>
          <span>Confirm new password</span>
          <input id="newPw2" type="password" autocomplete="new-password" minlength="6" required />
        </label>
        <div class="auth-actions">
          <button type="submit">Update password</button>
        </div>
      </form>
      <p class="auth-footer"><a id="backLink" href="admin.html">← Back</a></p>
    </section>
  </div>
  <script type="module" src="change-password-page.js"></script>
</body>
</html>
